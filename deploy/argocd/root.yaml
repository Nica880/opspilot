# App-of-apps: Argo CD syncs everything under deploy/argocd/apps from this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspilot-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nica880/opspilot.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
