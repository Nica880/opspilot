apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspilot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nica880/opspilot.git
    targetRevision: main
    path: deploy/helm/opspilot
    helm:
      releaseName: opspilot
  destination:
    server: https://kubernetes.default.svc
    namespace: opspilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      # The app waits for infra (Postgres, Redpanda) to come up on first sync.
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
