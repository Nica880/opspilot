apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspilot-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nica880/opspilot.git
    targetRevision: main
    path: deploy/helm/opspilot-infra
    helm:
      releaseName: opspilot-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: opspilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
