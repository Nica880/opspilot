apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-web
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: opspilot-web }
  template:
    metadata:
      labels: { app: opspilot-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: {{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: {{ .Values.web.port }}, name: http }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-web
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: opspilot-web }
  ports:
    - { name: http, port: {{ .Values.web.port }}, targetPort: http, nodePort: {{ .Values.web.nodePort }} }
