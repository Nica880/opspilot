apiVersion: v1
kind: Service
metadata:
  name: opspilot-phoenix
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: opspilot-phoenix }
  ports:
    - { name: http, port: 6006, targetPort: 6006, nodePort: {{ .Values.nodePorts.phoenix }} }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-phoenix
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: opspilot-phoenix }
  template:
    metadata:
      labels: { app: opspilot-phoenix }
    spec:
      containers:
        - name: phoenix
          image: {{ .Values.phoenix.image }}
          env:
            - name: PHOENIX_SQL_DATABASE_URL
              value: {{ printf "%s/phoenix" (include "infra.pgUrl" .) | quote }}
          ports:
            - { containerPort: 6006, name: http }
            - { containerPort: 4317, name: otlp-grpc }
          readinessProbe:
            tcpSocket: { port: 6006 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
