apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-postgres-init
  labels: {{- include "infra.labels" . | nindent 4 }}
data:
  01-init.sql: |
    CREATE DATABASE phoenix OWNER {{ .Values.postgres.user }};
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-postgres
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  selector: { app: opspilot-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opspilot-postgres
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: opspilot-postgres
  replicas: 1
  selector:
    matchLabels: { app: opspilot-postgres }
  template:
    metadata:
      labels: { app: opspilot-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { containerPort: 5432, name: postgres }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: opspilot-postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
