apiVersion: v1
kind: Service
metadata:
  name: opspilot-temporal
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  selector: { app: opspilot-temporal }
  ports:
    - { name: grpc, port: 7233, targetPort: 7233 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-temporal
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: opspilot-temporal }
  template:
    metadata:
      labels: { app: opspilot-temporal }
    spec:
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_PWD, value: {{ .Values.postgres.password | quote }} }
            - { name: POSTGRES_SEEDS, value: opspilot-postgres }
          ports:
            - { containerPort: 7233, name: grpc }
          readinessProbe:
            tcpSocket: { port: 7233 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-temporal-ui
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: opspilot-temporal-ui }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: {{ .Values.nodePorts.temporalUi }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-temporal-ui
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: opspilot-temporal-ui }
  template:
    metadata:
      labels: { app: opspilot-temporal-ui }
    spec:
      containers:
        - name: ui
          image: {{ .Values.temporal.uiImage }}
          env:
            - { name: TEMPORAL_ADDRESS, value: "opspilot-temporal:7233" }
          ports:
            - { containerPort: 8080, name: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
