apiVersion: v1
kind: Service
metadata:
  name: opspilot-qdrant
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  selector: { app: opspilot-qdrant }
  ports:
    - { name: http, port: 6333, targetPort: 6333 }
    - { name: grpc, port: 6334, targetPort: 6334 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opspilot-qdrant
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: opspilot-qdrant
  replicas: 1
  selector:
    matchLabels: { app: opspilot-qdrant }
  template:
    metadata:
      labels: { app: opspilot-qdrant }
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - { containerPort: 6333, name: http }
            - { containerPort: 6334, name: grpc }
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
